name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 Production Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/production
            cd /home/ubuntu/production
            git pull origin main || git clone -b main https://github.com/HassanMaskeen/cloud-pipeline-pro.git .
            sudo cp -r /home/ubuntu/production/* /var/www/html/
            sudo systemctl restart nginx
            echo "Production deployment and Nginx restart completed successfully!"
